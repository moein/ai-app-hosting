# Checks only (FND-7.1). No secrets here; deploys run from the terminal (pnpm deploy:dev / deploy:prod).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # actionlint (+ shellcheck, preinstalled on ubuntu runners) for the managed deploy workflow test (spec 08).
      - run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin actionlint
      - run: pnpm check:wrangler
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
